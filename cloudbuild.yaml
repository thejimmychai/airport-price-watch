steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/airport-price-watch:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/airport-price-watch:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'airport-price-watch'
      - '--image'
      - 'gcr.io/$PROJECT_ID/airport-price-watch:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--set-env-vars'
      - 'GSHEETS_ENABLED=true,GSHEETS_SPREADSHEET_ID=1wZykxwH2V4r54dYVXtM9RKAbWpcruIWcyDk9CqDENDE,GEMINI_MODEL=gemini-2.5-flash'
images:
  - 'gcr.io/$PROJECT_ID/airport-price-watch:$COMMIT_SHA'
